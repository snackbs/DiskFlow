<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="df-title df-desc">
  <title id="df-title">DiskFlow 磁盘流水</title>
  <desc id="df-desc">DiskFlow 应用图标：蓝色渐变圆角方形背景上，一枚白色磁盘被两道青色数据流箭头穿过，象征磁盘读写流水监测。</desc>

  <defs>
    <!-- 背景渐变：科技蓝（135°） -->
    <linearGradient id="df-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset=".55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <!-- 顶部高光 -->
    <linearGradient id="df-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".26"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 数据流渐变：青 -->
    <linearGradient id="df-stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <!-- 统一投影 -->
    <filter id="df-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172554" flood-opacity=".38"/>
    </filter>
  </defs>

  <!-- ① 背景：Windows 11 风格圆角方形（rx=58，约 22.7%） -->
  <g id="df-background">
    <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#df-bg)"/>
    <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#df-gloss)"/>
    <rect x="1" y="1" width="254" height="254" rx="57" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="2"/>
  </g>

  <!-- ② 数据流：左箭头流入磁盘（写入）/ 右箭头流出磁盘（读取），绘于磁盘下层 -->
  <g id="df-flow" fill="url(#df-stream)" filter="url(#df-shadow)">
    <rect x="20" y="119" width="30" height="18" rx="9"/>
    <path d="M50 111 L66 128 L50 145 Z"/>
    <rect x="190" y="119" width="30" height="18" rx="9"/>
    <path d="M220 111 L236 128 L220 145 Z"/>
  </g>

  <!-- ③ 磁盘：白色盘片（evenodd 挖出主轴孔，透出背景）+ 磁道弧 -->
  <g id="df-disk" filter="url(#df-shadow)">
    <path fill-rule="evenodd" fill="#FFFFFF" d="M128 76a52 52 0 1 0 0 104 52 52 0 1 0 0-104ZM128 119a9 9 0 1 0 0 18 9 9 0 1 0 0-18Z"/>
    <path d="M97 116.7A33 33 0 1 0 159 116.7" fill="none" stroke="#BFDBFE" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
